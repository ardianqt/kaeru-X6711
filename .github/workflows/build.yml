name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.publish-release.outputs.release_id }}
      tag: ${{ steps.publish-release.outputs.tag }}
    steps:
      - name: Create nightly release
        id: publish-release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const start = new Date();
            const pad = (n) => String(n).padStart(2, '0');
            const stamp = `${start.getUTCFullYear()}.${pad(start.getUTCMonth() + 1)}.${pad(start.getUTCDate())}-${pad(start.getUTCHours())}${pad(start.getUTCMinutes())}${pad(start.getUTCSeconds())}`;
            const releaseBody = [
              '## Kaeru X6711 Nightly',
              '',
              'Built from latest push to `main`.',
              '',
              '### What is this?',
              '',
              'Kaeru payload for Infinix X6711 (MT6833) bootloader.',
              'Patches LK to disable orange state, spoof green state, and lock VBMeta.',
              '',
              '### How to use',
              '',
              '1. Download `x6711-kaeru.bin`',
              '2. Flash to LK partition via fastboot:',
              '   ```',
              '   fastboot flash lk x6711-kaeru.bin',
              '   fastboot reboot',
              '   ```',
              '',
              '### Credits',
              '',
              '- R0rt1z2 & AntiEngineer - Kaeru framework',
              '- coolishsecv2 - X6711 port',
            ].join('\n');
            let tagName = `nightly-${stamp}`;
            let release;
            for (let attempt = 0; attempt < 5; attempt++) {
              try {
                const response = await github.rest.repos.createRelease({
                  owner,
                  repo,
                  tag_name: tagName,
                  name: `Kaeru X6711 nightly ${stamp}`,
                  body: releaseBody,
                  draft: false,
                  prerelease: false,
                  generate_release_notes: false,
                  target_commitish: context.sha,
                });
                release = response.data;
                break;
              } catch (error) {
                if (error.status !== 422) throw error;
                tagName = `nightly-${stamp}-${attempt + 1}`;
              }
            }
            if (!release) throw new Error('could not create release');
            core.setOutput('release_id', String(release.id));
            core.setOutput('tag', tagName);

  build:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf python3 python3-pip git make

      - name: Install lkpatcher
        run: pip3 install --upgrade git+https://github.com/R0rt1z2/lkpatcher

      - name: Build kaeru payload
        run: |
          make clean || true
          make distclean || true
          make x6711_defconfig
          make -j$(nproc)

      - name: Check build output
        run: |
          echo "=== Build output ==="
          ls -la out/ || echo "No out/ directory"
          ls -la *.bin 2>/dev/null || echo "No .bin files"
          find . -name "*.bin" -o -name "kaeru" -o -name "stageone" | head -20

      - name: Upload payload to release
        run: |
          cd out 2>/dev/null || true
          for f in *.bin kaeru stageone; do
            if [ -f "$f" ]; then
              echo "Uploading $f"
              gh release upload "${{ needs.create-release.outputs.tag }}" "$f" --clobber
            fi
          done
          echo "Done uploading"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  package:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download payload from release
        run: |
          mkdir -p package
          gh release download "${{ needs.create-release.outputs.tag }}" -D package/ --pattern "*.bin" || true
          ls -la package/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release archive
        run: |
          cd package
          if ls *.bin 1>/dev/null 2>&1; then
            tar czf ../kaeru-x6711-nightly.tar.gz *.bin
            cd ..
            gh release upload "${{ needs.create-release.outputs.tag }}" kaeru-x6711-nightly.tar.gz --clobber
            echo "Uploaded archive"
          else
            echo "No .bin files to archive"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
