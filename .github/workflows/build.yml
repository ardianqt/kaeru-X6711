name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.publish-release.outputs.release_id }}
      tag: ${{ steps.publish-release.outputs.tag }}
    steps:
      - name: Create nightly release
        id: publish-release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const start = new Date();
            const pad = (n) => String(n).padStart(2, '0');
            const stamp = `${start.getUTCFullYear()}.${pad(start.getUTCMonth() + 1)}.${pad(start.getUTCDate())}-${pad(start.getUTCHours())}${pad(start.getUTCMinutes())}${pad(start.getUTCSeconds())}`;
            const releaseBody = [
              '## Kaeru X6711 Nightly',
              '',
              'Built from latest push to `main`.',
              '',
              '### What is this?',
              '',
              'Full patched LK for Infinix X6711 (MT6833).',
              'Ready to flash - includes orange state disable, green state spoof, VBMeta lock spoof.',
              '',
              '### Downloads',
              '',
              '- `x6711-kaeru.bin` - Full patched LK (~1.37MB, ready to flash)',
              '- `kaeru` - Raw kaeru payload',
              '- `stageone` - Stage1 loader',
              '',
              '### Flash',
              '',
              '```',
              'fastboot flash lk x6711-kaeru.bin',
              'fastboot reboot',
              '```',
              '',
              '### Features',
              '',
              '- Orange state warning disabled',
              '- Green state spoof (verifiedbootstate)',
              '- VBMeta locked spoof',
              '- Volume key -> Fastboot override',
              '- Boot splash screen',
              '',
              '### Credits',
              '',
              '- R0rt1z2 & AntiEngineer - Kaeru framework',
              '- coolishsecv2 - X6711 port',
            ].join('\n');
            let tagName = `nightly-${stamp}`;
            let release;
            for (let attempt = 0; attempt < 5; attempt++) {
              try {
                const response = await github.rest.repos.createRelease({
                  owner,
                  repo,
                  tag_name: tagName,
                  name: `Kaeru X6711 nightly ${stamp}`,
                  body: releaseBody,
                  draft: false,
                  prerelease: false,
                  generate_release_notes: false,
                  target_commitish: context.sha,
                });
                release = response.data;
                break;
              } catch (error) {
                if (error.status !== 422) throw error;
                tagName = `nightly-${stamp}-${attempt + 1}`;
              }
            }
            if (!release) throw new Error('could not create release');
            core.setOutput('release_id', String(release.id));
            core.setOutput('tag', tagName);

  build:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf python3 python3-pip git make

      - name: Install lkpatcher
        run: pip3 install --upgrade git+https://github.com/R0rt1z2/lkpatcher

      - name: Verify LK image exists
        run: |
          if [ ! -f "lk_x6711.img" ]; then
            echo "ERROR: lk_x6711.img not found in repo"
            exit 1
          fi
          ls -la lk_x6711.img
          echo "LK image size: $(stat -c%s lk_x6711.img) bytes"

      - name: Build kaeru payload
        run: |
          make clean || true
          make distclean || true
          make x6711_defconfig
          make -j$(nproc)

      - name: Patch LK with kaeru
        run: |
          echo "Patching LK image..."
          python3 utils/patch.py configs/infinix/x6711_defconfig lk_x6711.img kaeru -l stageone -o x6711-kaeru.bin
          echo ""
          echo "=== Patched binary ==="
          ls -la x6711-kaeru.bin
          echo "Size: $(stat -c%s x6711-kaeru.bin) bytes"

      - name: Upload to release
        run: |
          # Upload patched binary
          gh release upload "${{ needs.create-release.outputs.tag }}" x6711-kaeru.bin --clobber
          echo "Uploaded x6711-kaeru.bin"
          
          # Upload raw payloads
          gh release upload "${{ needs.create-release.outputs.tag }}" kaeru --clobber
          gh release upload "${{ needs.create-release.outputs.tag }}" stageone --clobber
          echo "Uploaded kaeru and stageone"
          
          echo "=== Release files ==="
          gh release view "${{ needs.create-release.outputs.tag }}" --json assets -q '.assets[].name + " (" + (.size|tostring) + " bytes)"'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
