name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      lk_url:
        description: 'URL to LK image (optional - will build payload only if not provided)'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.publish-release.outputs.release_id }}
      tag: ${{ steps.publish-release.outputs.tag }}
    steps:
      - name: Create nightly release
        id: publish-release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const start = new Date();
            const pad = (n) => String(n).padStart(2, '0');
            const stamp = `${start.getUTCFullYear()}.${pad(start.getUTCMonth() + 1)}.${pad(start.getUTCDate())}-${pad(start.getUTCHours())}${pad(start.getUTCMinutes())}${pad(start.getUTCSeconds())}`;
            const lkUrl = context.payload.inputs?.lk_url || '';
            const hasLk = lkUrl && lkUrl.length > 0;
            const releaseBody = [
              '## Kaeru X6711 Nightly',
              '',
              'Built from latest push to `main`.',
              '',
              '### What is this?',
              '',
              'Kaeru patch for Infinix X6711 (MT6833) bootloader.',
              'Patches LK to disable orange state, spoof green state, and lock VBMeta.',
              '',
              '### Downloads',
              '',
              hasLk ? '- `x6711-kaeru.bin` - Full patched LK image (ready to flash)' : '',
              '- `kaeru` - Kaeru payload (for manual patching)',
              '- `stageone` - Stage1 loader',
              '',
              '### How to use',
              '',
              hasLk ? [
                '1. Download `x6711-kaeru.bin`',
                '2. Flash via fastboot:',
                '   ```',
                '   fastboot flash lk x6711-kaeru.bin',
                '   fastboot reboot',
                '   ```',
              ].join('\n') : [
                'If you have the LK image, run locally:',
                '```',
                'python3 utils/patch.py configs/infinix/x6711_defconfig lk.img kaeru -l stageone -o x6711-kaeru.bin',
                '```',
                '',
                'Or trigger workflow with LK URL:',
                'Actions -> Build & Release -> Run workflow -> Provide lk_url',
              ].join('\n'),
              '',
              '### Features',
              '',
              '- Orange state warning disabled',
              '- Green state spoof (verifiedbootstate)',
              '- VBMeta locked spoof',
              '- Volume key -> Fastboot override',
              '- Boot splash screen',
              '',
              '### Credits',
              '',
              '- R0rt1z2 & AntiEngineer - Kaeru framework',
              '- coolishsecv2 - X6711 port',
            ].join('\n');
            let tagName = `nightly-${stamp}`;
            let release;
            for (let attempt = 0; attempt < 5; attempt++) {
              try {
                const response = await github.rest.repos.createRelease({
                  owner,
                  repo,
                  tag_name: tagName,
                  name: `Kaeru X6711 nightly ${stamp}`,
                  body: releaseBody,
                  draft: false,
                  prerelease: false,
                  generate_release_notes: false,
                  target_commitish: context.sha,
                });
                release = response.data;
                break;
              } catch (error) {
                if (error.status !== 422) throw error;
                tagName = `nightly-${stamp}-${attempt + 1}`;
              }
            }
            if (!release) throw new Error('could not create release');
            core.setOutput('release_id', String(release.id));
            core.setOutput('tag', tagName);

  build:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf python3 python3-pip git make wget

      - name: Install lkpatcher
        run: pip3 install --upgrade git+https://github.com/R0rt1z2/lkpatcher

      - name: Build kaeru payload
        run: |
          make clean || true
          make distclean || true
          make x6711_defconfig
          make -j$(nproc)

      - name: Check build outputs
        run: |
          echo "=== Build outputs ==="
          ls -la kaeru stageone 2>/dev/null || echo "Some files missing"
          file kaeru stageone 2>/dev/null || true

      - name: Download LK image if provided
        if: ${{ github.event.inputs.lk_url != '' }}
        run: |
          echo "Downloading LK from: ${{ github.event.inputs.lk_url }}"
          wget -q "${{ github.event.inputs.lk_url }}" -O lk.img
          ls -la lk.img
          file lk.img

      - name: Patch LK with kaeru
        if: ${{ github.event.inputs.lk_url != '' }}
        run: |
          python3 utils/patch.py configs/infinix/x6711_defconfig lk.img kaeru -l stageone -o x6711-kaeru.bin
          ls -la x6711-kaeru.bin
          echo "Patched binary size: $(stat -c%s x6711-kaeru.bin) bytes"

      - name: Upload payload to release
        run: |
          # Always upload raw payloads
          for f in kaeru stageone; do
            if [ -f "$f" ]; then
              echo "Uploading $f"
              gh release upload "${{ needs.create-release.outputs.tag }}" "$f" --clobber
            fi
          done
          
          # Upload patched binary if it exists
          if [ -f "x6711-kaeru.bin" ]; then
            echo "Uploading x6711-kaeru.bin"
            gh release upload "${{ needs.create-release.outputs.tag }}" x6711-kaeru.bin --clobber
            echo "Final size: $(stat -c%s x6711-kaeru.bin) bytes"
          else
            echo "No patched binary (LK image not provided)"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
