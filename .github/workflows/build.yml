name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.publish-release.outputs.release_id }}
      tag: ${{ steps.publish-release.outputs.tag }}
    steps:
      - name: Create nightly release
        id: publish-release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const start = new Date();
            const pad = (n) => String(n).padStart(2, '0');
            const stamp = `${start.getUTCFullYear()}.${pad(start.getUTCMonth() + 1)}.${pad(start.getUTCDate())}-${pad(start.getUTCHours())}${pad(start.getUTCMinutes())}${pad(start.getUTCSeconds())}`;
            const releaseBody = [
              '## Kaeru X6711 Nightly',
              '',
              'Built from latest push to `main`.',
              '',
              '### What is this?',
              '',
              'Kaeru payload for Infinix X6711 (MT6833) bootloader.',
              'Patches LK to disable orange state, spoof green state, and lock VBMeta.',
              '',
              '### How to use',
              '',
              '1. Download `x6711-kaeru.bin` and `x6711-stageone.bin`',
              '2. Flash to LK partition via fastboot:',
              '   ```',
              '   fastboot flash lk x6711-kaeru.bin',
              '   fastboot reboot',
              '   ```',
              '',
              '### Features',
              '',
              '- Orange state warning disabled',
              '- Green state spoof (verifiedbootstate)',
              '- VBMeta locked spoof',
              '- Volume key -> Fastboot override',
              '',
              '### Credits',
              '',
              '- R0rt1z2 & AntiEngineer - Kaeru framework',
              '- coolishsecv2 - X6711 port',
            ].join('\n');
            let tagName = `nightly-${stamp}`;
            let release;
            for (let attempt = 0; attempt < 5; attempt++) {
              try {
                const response = await github.rest.repos.createRelease({
                  owner,
                  repo,
                  tag_name: tagName,
                  name: `Kaeru X6711 nightly ${stamp}`,
                  body: releaseBody,
                  draft: false,
                  prerelease: false,
                  generate_release_notes: false,
                  target_commitish: context.sha,
                });
                release = response.data;
                break;
              } catch (error) {
                if (error.status !== 422) throw error;
                tagName = `nightly-${stamp}-${attempt + 1}`;
              }
            }
            if (!release) throw new Error('could not create release');
            core.setOutput('release_id', String(release.id));
            core.setOutput('tag', tagName);

  build:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf python3 python3-pip git make

      - name: Install lkpatcher
        run: pip3 install --upgrade git+https://github.com/R0rt1z2/lkpatcher

      - name: Build kaeru payload
        run: |
          make clean || true
          make distclean || true
          make x6711_defconfig
          make -j$(nproc)

      - name: Find and rename build outputs
        run: |
          echo "=== Build directory ==="
          pwd
          ls -la
          echo ""
          echo "=== Finding kaeru files ==="
          find . -maxdepth 2 -name "kaeru" -o -name "stageone" -o -name "*.bin" 2>/dev/null
          echo ""
          echo "=== Looking in build output ==="
          find . -path "*/built-in.o" 2>/dev/null | head -5
          
          # The build produces 'kaeru' and 'stageone' in root
          if [ -f "kaeru" ]; then
            cp kaeru x6711-kaeru.bin
            echo "Created x6711-kaeru.bin"
          fi
          if [ -f "stageone" ]; then
            cp stageone x6711-stageone.bin
            echo "Created x6711-stageone.bin"
          fi
          
          echo ""
          echo "=== Final files ==="
          ls -la *.bin 2>/dev/null || echo "No .bin files found"

      - name: Upload to release
        run: |
          for f in x6711-kaeru.bin x6711-stageone.bin; do
            if [ -f "$f" ]; then
              echo "Uploading $f"
              gh release upload "${{ needs.create-release.outputs.tag }}" "$f" --clobber
            else
              echo "WARNING: $f not found"
            fi
          done
          echo "Upload complete"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
